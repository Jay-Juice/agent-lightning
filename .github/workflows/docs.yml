name: Deploy Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --no-default-groups --group dev --group docs

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Get version and commit
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            SOURCE_COMMIT=${GITHUB_SHA}
          else
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            SOURCE_COMMIT=${GITHUB_SHA}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> $GITHUB_ENV

      - name: Deploy versioned docs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run --locked --no-sync mike deploy --push --update-aliases ${{ steps.version.outputs.version }} stable

      - name: Deploy dev docs
        if: github.ref == 'refs/heads/main'
        run: |
          uv run --locked --no-sync mike deploy --push latest
          # A fresh fork has no versioned release and therefore no stable alias.
          # Tagged releases create stable; development-only repositories default
          # to the latest documentation until that first release exists.
          if ! uv run --locked --no-sync mike set-default --push stable; then
            uv run --locked --no-sync mike set-default --push latest
          fi
